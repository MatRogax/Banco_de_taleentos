name: banco_de_talentos_flutter
description: A new Flutter project for Banco de Talentos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.5
  
  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.1
  
  # Navigation
  go_router: ^14.1.1
  
  # Functional Programming (Left/Right)
  fpdart: ^1.1.0
  
  # Value equality
  equatable: ^2.0.5
  
  # Supabase integration
  supabase_flutter: ^2.5.4
  envied: ^1.3.8
  shared_preferences: ^2.2.3
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.15.0
  injectable_generator: ^2.6.1
  envied_generator: ^1.3.8

flutter:
  uses-material-design: true
